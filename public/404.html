<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <script>
      var l = window.location;
      var repo = '/Life-Mentor-Frontend';
      var path = l.pathname.startsWith(repo) ? l.pathname.slice(repo.length) : l.pathname;
      window.location.replace(
        l.origin + repo + '/?redirect=' + encodeURIComponent(path + l.search + l.hash)
      );
    </script>
  </head>
  <body></body>
</html>
